name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: formadigital-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Verify backend
        working-directory: apps/backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test -- --runInBand

      - name: Verify frontend
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Harv3st
        working-directory: services/harv3st
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app core config.py manager.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/formadigital
          chmod 600 ~/.ssh/formadigital
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -i ~/.ssh/formadigital "$VPS_USER@$VPS_HOST" 'cd /opt/data/formadigital_app && ./deploy.sh'
